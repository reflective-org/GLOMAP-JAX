[build-system]
# >=1.27 for PEP 639 licence expressions and license-files
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glomap-jax"
version = "0.1.0"
description = "Differentiable GLOMAP-mode aerosol microphysics in Python/JAX, ported faithfully from the UKCA Fortran"
readme = "README.md"
license = "Apache-2.0"
# Ships the Apache text, the Met Office BSD notice, and the NOTICE that
# reproduces it into every wheel and sdist (BSD-3 clause 2).
license-files = ["LICENCE", "NOTICE", "fortran/LICENCE"]
authors = [{ name = "Ali Akherati", email = "ali@reflective.org" }]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "scipy",
]
dev = [
    "pytest",
    "scipy",
    "ruff",
    "mkdocs-material",
    "mkdocstrings[python]",
    # Required by numpy.f2py -c, which drives the in-process Fortran
    # comparison (Gate A). Not needed to import or test the pure-Python port.
    "meson",
    "ninja",
]
# Order 3 targets NVIDIA CUDA. Kept out of the default dependency set so a
# plain `pip install .` stays CPU-only and portable.
gpu = ["jax[cuda12]>=0.4.30"]

[project.urls]
Repository = "https://github.com/reflective-org/GLOMAP-JAX"

[tool.hatch.build.targets.wheel]
packages = ["src/glomap_jax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running soak tests (deselect with '-m \"not slow\"')",
    # CI has no gfortran/meson/ninja. Anything that builds or runs the Fortran
    # reference carries this marker and skips cleanly when the toolchain is
    # absent, so the suite stays green on every commit.
    "fortran: needs a Fortran toolchain to build/run the reference",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# fortran/ is the vendored read-only reference tree (see PROVENANCE.md). Its
# Python helpers came in with it and are not ours to reformat -- linting them
# would either fail CI or tempt an in-place edit that the tamper test forbids.
extend-exclude = ["fortran", ".claude", ".worktrees"]

[tool.ruff.lint.per-file-ignores]
# make_report.py is mostly one embedded HTML document held in a Python string.
# Reflowing CSS rules and template literals to 100 columns to satisfy a Python
# line-length rule would make the document harder to read, not easier.
"figures/make_report.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY", "RUF"]
